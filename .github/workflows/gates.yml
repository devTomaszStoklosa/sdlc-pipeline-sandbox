name: Gates

# Quality gates (spec 7.1, pipeline plan 3.6). The pipeline's reusable workflow
# runs them with the commands and thresholds of .sdlc-agents.yml from the base
# commit of the pull request. Each of its jobs is a required check of the
# "gates" ruleset, named `gates / <job>`, so a renamed job must be renamed
# there too.
on:
  pull_request:
  push:
    branches: [main]

# Jobs that run repository code must not create check runs or commit statuses (QG-7.14).
permissions:
  contents: read

jobs:
  # CodeQL uploads the results of the head commit to code scanning.
  gates:
    uses: devTomaszStoklosa/sdlc-multi-agent-pipeline/.github/workflows/gates.yml@5b079dc392c16c0439ed82f3ca5ad654efaaf94a
    permissions:
      contents: read
      security-events: write
    with:
      pipeline-ref: 5b079dc392c16c0439ed82f3ca5ad654efaaf94a

  # QG-7.9: every file that a run's pull request changes is in its plan. The
  # job of the pipeline's reusable workflow reads only public data, so its
  # token needs no more than read access.
  scope:
    if: github.event_name == 'pull_request'
    uses: devTomaszStoklosa/sdlc-multi-agent-pipeline/.github/workflows/scope-gate.yml@5b079dc392c16c0439ed82f3ca5ad654efaaf94a
    permissions:
      contents: read
      issues: read
      pull-requests: read
    with:
      pipeline-ref: 5b079dc392c16c0439ed82f3ca5ad654efaaf94a
      app-id: ${{ vars.APP_ID }}
