name: Gates

# Quality gates (spec 7.1, plan 3.6). Each job is a separate required check in
# the "gates" ruleset, so a renamed job must be renamed there too.
on:
  pull_request:
  push:
    branches: [main]

# Jobs that run repository code must not create check runs or commit statuses (QG-7.14).
permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  COVERAGE_DROP_TOLERANCE: 0

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run format:check

  # QG-7.1 and the complexity threshold of QG-7.7.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  # QG-7.5
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm test

  # QG-7.6: line coverage of the pull request compared with its base commit.
  coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run coverage -- --coverage.reportsDirectory="$RUNNER_TEMP/head-coverage"

      - name: Measure base coverage
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          cd "$RUNNER_TEMP/base"
          if [ -f package.json ]; then
            npm ci
            npm run coverage -- --coverage.reportsDirectory="$RUNNER_TEMP/base-coverage"
          else
            echo "The base commit has no package.json, so there is no base coverage."
          fi

      - name: Compare coverage
        run: >-
          node --experimental-strip-types .github/scripts/coverage-gate.ts
          "$RUNNER_TEMP/base-coverage/coverage-summary.json"
          "$RUNNER_TEMP/head-coverage/coverage-summary.json"
          "$COVERAGE_DROP_TOLERANCE"

  # QG-7.8
  duplication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run duplication

  # QG-7.3
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan history for secrets
        run: gitleaks git --redact --verbose

  # The commit-msg hook again in CI (QG-7.12, QG-9.14).
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # QG-7.9: every file that a run's pull request changes is in its plan. The
  # job of the pipeline's reusable workflow reads only public data, so its
  # token needs no more than read access.
  scope:
    if: github.event_name == 'pull_request'
    uses: devTomaszStoklosa/sdlc-multi-agent-pipeline/.github/workflows/scope-gate.yml@753211bea2eac85fc3a00443b73ed610d32514bf
    permissions:
      contents: read
      issues: read
      pull-requests: read
    with:
      pipeline-ref: 753211bea2eac85fc3a00443b73ed610d32514bf
      app-id: ${{ vars.APP_ID }}

  # QG-7.4
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
