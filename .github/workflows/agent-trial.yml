name: Agent trial

# A manual trial agent session with the pipeline hooks and sandbox (pipeline
# plan, P2). It runs only from main, because only main may use the `agents`
# environment with the Claude Code token. The pipeline is pinned to a commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial:
    uses: devTomaszStoklosa/sdlc-multi-agent-pipeline/.github/workflows/agent-trial.yml@7c319a5ff478f8972a66f3b0e66d81d878e41833
    with:
      pipeline-ref: 7c319a5ff478f8972a66f3b0e66d81d878e41833
    # The token exists only in the `agents` environment, but a reusable
    # workflow gets an environment secret only when the caller passes it by
    # name. Only the called job, which runs in that environment, can read it.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
