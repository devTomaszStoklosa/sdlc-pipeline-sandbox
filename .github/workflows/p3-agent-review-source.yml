name: P3 agent-review source

# Temporary workflow of the P3 test pull request. It is never merged.
# It creates an agent-review check run from the source named in SOURCE.
on:
  pull_request:

permissions:
  contents: read

env:
  SOURCE: github-actions

jobs:
  publish-agent-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: env.SOURCE == 'app'
        id: app
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Create the agent-review check run
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs"
          -f name=agent-review -f head_sha="$HEAD_SHA"
          -f status=completed -f conclusion=success
          -f "output[title]=P3 test: source $SOURCE"
          -f "output[summary]=Created by the P3 test workflow."
          --jq '"\(.name) \(.conclusion) app=\(.app.slug)"'
