name: Orchestrate

# The pipeline's orchestrator (pipeline plan, P4): labels, comments, finished
# gates and manual dispatches drive the runs of the issues. The pipeline is
# pinned to a commit. From P7 on, every role runs on Claude Code.
on:
  issues:
    types: [labeled, unlabeled]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [Gates]
    types: [completed]
  # Starts a run waiting in the queue or recovers an event that did not
  # arrive. Only users with write permission count.
  workflow_dispatch:
    inputs:
      issue:
        description: Number of the issue
        required: true
        type: string

permissions:
  contents: read

jobs:
  orchestrate:
    uses: devTomaszStoklosa/sdlc-multi-agent-pipeline/.github/workflows/orchestrate.yml@2540a97a749d748424aaac20997528799752e635
    # The most that the jobs of the called workflow may use; each job narrows
    # its own token further.
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    with:
      pipeline-ref: 2540a97a749d748424aaac20997528799752e635
      app-client-id: ${{ vars.APP_CLIENT_ID }}
      app-id: ${{ vars.APP_ID }}
    # The Claude Code token exists only in the `agents` environment, but a
    # reusable workflow gets an environment secret only when the caller passes
    # it by name. Only the role jobs, which run in that environment, read it.
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
