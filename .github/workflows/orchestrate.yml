name: Orchestrate

# The pipeline's orchestrator (pipeline plan, P4): labels, comments, finished
# gates and manual dispatches drive the runs of the issues. The pipeline is
# pinned to a commit. In P4 the roles are stubs, so no job gets the Claude
# Code token.
on:
  issues:
    types: [labeled, unlabeled]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [Gates]
    types: [completed]
  # Starts a run waiting in the queue or recovers an event that did not
  # arrive. Only users with write permission count.
  workflow_dispatch:
    inputs:
      issue:
        description: Number of the issue
        required: true
        type: string

permissions:
  contents: read

jobs:
  orchestrate:
    uses: devTomaszStoklosa/sdlc-multi-agent-pipeline/.github/workflows/orchestrate.yml@87606f5c627816a517729b287359530ca83137d7
    # The most that the jobs of the called workflow may use; each job narrows
    # its own token further.
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    with:
      pipeline-ref: 87606f5c627816a517729b287359530ca83137d7
      app-client-id: ${{ vars.APP_CLIENT_ID }}
      app-id: ${{ vars.APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
